name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint / Type Check / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No "version" here on purpose: package.json already declares
        # packageManager: pnpm@9.15.2. Specifying it in both places makes
        # pnpm/action-setup fail with ERR_PNPM_BAD_PM_VERSION, which aborted
        # every run at this step (11s, before install).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
